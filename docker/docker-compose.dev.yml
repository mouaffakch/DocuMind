services:
  postgres:
    image: postgres:16-alpine
    container_name: documind_dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: documind_user
      POSTGRES_PASSWORD: documind_password
      POSTGRES_DB: documind_db
    ports:
      - "5432:5432"
    volumes:
      - documind_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind_user -d documind_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: documind_dev_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - documind_dev_qdrant:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: documind_dev_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  documind_dev_pgdata:
  documind_dev_qdrant:
