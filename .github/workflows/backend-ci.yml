name: Backend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: documind_user
          POSTGRES_PASSWORD: documind_password
          POSTGRES_DB: documind_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:v1.12.1
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql+asyncpg://documind_user:documind_password@localhost:5432/documind_test_db
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          SECRET_KEY: test-secret-key-for-continuous-integration-must-be-long
          ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS0zMmJ5dGVzISEhISE=
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml
