name: DocuMind CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-quality-and-tests:
    name: Backend Tests & RAG Evaluation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: documind_user
          POSTGRES_PASSWORD: documind_password
          POSTGRES_DB: documind_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run Pytest Test Suite
        working-directory: backend
        env:
          DOCUMIND_TESTING: "true"
          ENVIRONMENT: "testing"
          SECRET_KEY: "ci-secret-key-for-testing-purposes-min32chars"
        run: |
          pytest -v --cov=app --cov-report=term-missing

      - name: Run Scientific RAG Evaluation
        working-directory: backend
        run: |
          python scripts/evaluate_rag.py

  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Compile TypeScript & Vite Build
        working-directory: frontend
        run: npm run build

  docker-validation:
    name: Docker Stack Build Validation
    runs-on: ubuntu-latest
    needs: [backend-quality-and-tests, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: |
          docker compose -f docker/docker-compose.yml config
